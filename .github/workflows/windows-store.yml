name: Windows Store Package

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Partner Center package identity name"
        required: false
        default: "kansic.AtelierAgent"
      publisher_name:
        description: "Partner Center publisher, for example CN=..."
        required: false
        default: "CN=E75CA449-69F2-4960-A78F-8A7AFCFAC54F"
      publisher_display_name:
        description: "Partner Center publisher display name"
        required: false
        default: "kansic"
      app_display_name:
        description: "App display name shown in Windows"
        required: false
        default: "Atelier Agent"
      package_version:
        description: "MSIX four-part version. Empty uses package.json version + .0"
        required: false
        default: ""
      build_msi_candidate:
        description: "Also build the slower offline-WebView2 MSI candidate"
        required: false
        type: boolean
        default: false

jobs:
  build-store-packages:
    name: Build Windows Store packages
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      WINAPP_CLI_TELEMETRY_OPTOUT: "1"
      ATELIER_PTY_SMOKE_WRITES: "300"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt,clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm deps
        run: npm ci --legacy-peer-deps

      - name: Install Rust security audit
        run: cargo install cargo-audit --locked

      - name: Run Store release quality gates
        shell: pwsh
        run: |
          npm run build
          npm run harness:fixture
          npm run smoke:terminal-layout
          npm run smoke:diff-review
          npm run smoke:review-workflow
          npm run smoke:agent-fleet
          npm run smoke:editor-diagnostics
          npm run smoke:devscreen-picker
          npm run smoke:agent-performance
          npm run gate:orca-features
          npm audit --audit-level=low
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features store-build -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features store-build -- --nocapture
          cargo build --manifest-path src-tauri/Cargo.toml
          npm run smoke:pty-supervisor
          npm run smoke:updater-contract
          npm run audit:release
          powershell -ExecutionPolicy Bypass -File tools/windows-provider-smoke.ps1 -SelfTest
          powershell -ExecutionPolicy Bypass -File tools/windows-provider-smoke.ps1 -Install -Strict

      - name: Install winapp CLI
        run: npm install -g @microsoft/winappcli@0.3.1

      - name: Build Microsoft Store MSIX package
        shell: pwsh
        env:
          ATELIER_STORE_PACKAGE_NAME: ${{ inputs.package_name }}
          ATELIER_STORE_PUBLISHER_NAME: ${{ inputs.publisher_name }}
          ATELIER_STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
          ATELIER_STORE_APP_DISPLAY_NAME: ${{ inputs.app_display_name }}
          ATELIER_STORE_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: npm run store:msix

      - name: Verify Store package payload
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/windows-package-smoke.ps1

      - name: Upload Store MSIX package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atelier-windows-store-msix
          path: output/windows-store/*.msix
          if-no-files-found: error

      - name: Build Tauri Store MSI candidate
        if: ${{ inputs.build_msi_candidate }}
        shell: pwsh
        run: npm run tauri:store:msi

      - name: Upload Store MSI candidate
        if: ${{ inputs.build_msi_candidate }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atelier-windows-store-msi-candidate
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
