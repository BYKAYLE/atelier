name: Windows Provider Smoke

on:
  workflow_dispatch:
    inputs:
      run_install:
        description: "Install missing Claude/Codex/Hermes CLIs on the Windows runner"
        required: false
        type: boolean
        default: true
      verify_browser_process:
        description: "Build Atelier and require a real browser process after the native OAuth handoff"
        required: false
        type: boolean
        default: true

jobs:
  provider-smoke:
    name: CLI install/status smoke
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install dependencies and build the Atelier browser helper
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm run gate:orca-features
          cargo build --manifest-path src-tauri/Cargo.toml

      - name: Run Windows provider smoke
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/windows-provider-smoke.ps1 -SelfTest
          $scriptArgs = @("-File", "tools/windows-provider-smoke.ps1", "-Strict")
          if ("${{ inputs.run_install }}" -eq "true") {
            $scriptArgs += "-Install"
          }
          powershell -ExecutionPolicy Bypass @scriptArgs
          if ("${{ inputs.verify_browser_process }}" -eq "true") {
            powershell -ExecutionPolicy Bypass -File tools/windows-provider-smoke.ps1 `
              -AtelierExe "$PWD\src-tauri\target\debug\atelier.exe" `
              -ProbeBrowserHandoff `
              -RequireBrowserProcessEvidence
          }

      - name: Collect smoke diagnostics
        if: always()
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/collect-windows-provider-evidence.ps1 -Destination artifacts/windows-provider-smoke

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atelier-windows-provider-smoke
          path: artifacts/windows-provider-smoke/*
          if-no-files-found: warn
