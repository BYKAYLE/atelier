name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_OWNER: ${{ vars.RELEASE_OWNER || github.repository_owner }}
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.event.repository.name }}
  ATELIER_PTY_SMOKE_WRITES: "300"
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
  SIGNPATH_WAIT_TIMEOUT_SECONDS: ${{ vars.SIGNPATH_WAIT_TIMEOUT_SECONDS || '3600' }}

jobs:
  release-preflight:
    name: Verify release identity and signing configuration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Reject an untrusted or unshippable tag before building
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$expected_version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_version" >&2
            exit 1
          }
          test "$RELEASE_OWNER/$RELEASE_REPO" = "$GITHUB_REPOSITORY" || {
            echo "Release repository must remain bound to $GITHUB_REPOSITORY" >&2
            exit 1
          }
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA" || {
            echo "Checked-out tag does not resolve to GITHUB_SHA" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag commit is not contained in origin/main" >&2
            exit 1
          }

          required=(
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing release credential(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          gh api "repos/$RELEASE_OWNER/$RELEASE_REPO/releases?per_page=100" > release-list.json
          node - <<'NODE'
          const releases = require("./release-list.json");
          const release = releases.find((entry) => entry.tag_name === process.env.GITHUB_REF_NAME);
          if (release && !release.draft) throw new Error("Release tag is already public");
          if (release?.prerelease) throw new Error("Release candidate must not be a prerelease");
          NODE

  build-macos:
    name: Build macOS release
    needs: release-preflight
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm deps
        run: npm ci --legacy-peer-deps

      - name: Install Rust security audit
        run: cargo install cargo-audit --locked

      - name: Run release quality gates
        run: |
          npm run build
          npm run harness:fixture
          npm run smoke:terminal-layout
          npm run smoke:diff-review
          npm run smoke:review-workflow
          npm run smoke:agent-fleet
          npm run smoke:editor-diagnostics
          npm run smoke:devscreen-picker
          npm run smoke:agent-performance
          # The feature gate intentionally leaves a restricted bundle in dist.
          # Rebuild the default product before any package is created.
          npm run gate:orca-features
          npm run build
          npm audit --audit-level=low
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          cargo build --manifest-path src-tauri/Cargo.toml
          npm run smoke:pty-supervisor
          npm run smoke:updater-contract
          npm run smoke:release-candidate
          npm run smoke:publish-evidence
          npm run audit:release

      - name: Generate release notes
        id: release-notes
        run: node .github/scripts/generate-release-notes.mjs

      - name: Require Developer ID signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required macOS release secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prove packaged renderer startup
        run: |
          npm run tauri -- build --bundles app
          npm run smoke:renderer-ready:mac

      - name: Build and upload macOS bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          owner: ${{ env.RELEASE_OWNER }}
          repo: ${{ env.RELEASE_REPO }}
          tagName: ${{ github.ref_name }}
          releaseName: "Atelier ${{ github.ref_name }}"
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: "--target universal-apple-darwin"

      - name: Verify and bind macOS release packages
        env:
          MACOS_BUNDLE_ROOT: target/universal-apple-darwin/release/bundle
          MACOS_EVIDENCE_OUTPUT: macos-release-evidence.json
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: tools/macos-release-evidence.sh

      - name: Upload macOS verification evidence to the private draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" macos-release-evidence.json \
            --repo "$RELEASE_OWNER/$RELEASE_REPO" \
            --clobber

  build-windows-unsigned:
    name: Build unsigned Windows bundle
    needs: release-preflight
    permissions:
      contents: read
    runs-on: windows-latest
    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt,clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm deps
        run: npm ci --legacy-peer-deps

      - name: Install Rust security audit
        run: cargo install cargo-audit --locked

      - name: Probe Windows CLI and auth paths
        shell: pwsh
        run: |
          npm run build
          npm run harness:fixture
          npm run smoke:terminal-layout
          npm run smoke:diff-review
          npm run smoke:review-workflow
          npm run smoke:agent-fleet
          npm run smoke:editor-diagnostics
          npm run smoke:devscreen-picker
          npm run smoke:agent-performance
          # Restore the full production bundle after restricted feature builds.
          npm run gate:orca-features
          npm run build
          npm audit --audit-level=low
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features store-build -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features store-build -- --nocapture
          cargo build --manifest-path src-tauri/Cargo.toml
          npm run smoke:pty-supervisor
          npm run smoke:updater-contract
          npm run smoke:release-candidate
          npm run smoke:publish-evidence
          npm run audit:release
          powershell -ExecutionPolicy Bypass -File tools/windows-provider-smoke.ps1 -SelfTest
          powershell -ExecutionPolicy Bypass -File tools/windows-provider-smoke.ps1 -Install -Strict

      - name: Build unsigned Windows installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci

      - name: Verify Windows installer payloads
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/windows-package-smoke.ps1

      - name: Collect unsigned Windows installers
        shell: pwsh
        run: .github/scripts/collect-windows-signpath-artifact.ps1

      - name: Upload unsigned artifact for SignPath
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atelier-windows-unsigned-${{ github.ref_name }}
          path: signpath-windows-unsigned
          if-no-files-found: error

  sign-windows:
    name: Sign Windows bundle with SignPath
    needs:
      - build-macos
      - build-windows-unsigned
    permissions:
      actions: read
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install npm deps
        run: npm ci --legacy-peer-deps

      - name: Check SignPath configuration
        id: signpath-config
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        run: |
          $required = @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG"
          )
          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing required SignPath repository value(s): $($missing -join ', '). Unsigned Windows installers must not be published."
          } else {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Submit SignPath signing request
        if: ${{ steps.signpath-config.outputs.ready == 'true' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG == '' }}
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build-windows-unsigned.outputs.unsigned-artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_WAIT_TIMEOUT_SECONDS }}
          output-artifact-directory: signed-windows
          parameters: |
            version: ${{ github.ref_name }}

      - name: Submit SignPath signing request with artifact configuration
        if: ${{ steps.signpath-config.outputs.ready == 'true' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build-windows-unsigned.outputs.unsigned-artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_WAIT_TIMEOUT_SECONDS }}
          output-artifact-directory: signed-windows
          parameters: |
            version: ${{ github.ref_name }}

      - name: Create updater signatures for Windows installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: .github/scripts/finalize-signpath-windows.ps1

      - name: Verify signed installer payloads
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/windows-package-smoke.ps1 -BundleRoot release-assets/windows -RequireAuthenticode

      - name: Download existing updater JSON
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          gh release download $env:GITHUB_REF_NAME `
            --repo "$env:RELEASE_OWNER/$env:RELEASE_REPO" `
            --pattern latest.json `
            --dir release-assets `
            --clobber 2>$null
          if ($LASTEXITCODE -ne 0) {
            '{"version":"","notes":"","pub_date":"","platforms":{}}' | Set-Content -Path release-assets/latest.json -Encoding UTF8
          }

      - name: Merge Windows entries into updater JSON
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PREFER_WINDOWS_INSTALLER: msi
        run: node .github/scripts/update-tauri-latest-json.mjs

      - name: Validate Windows updater compatibility target
        shell: pwsh
        run: |
          node -e "const j=require('./release-assets/latest.json'); const url=j.platforms?.['windows-x86_64']?.url || ''; if (!url.endsWith('.msi')) { console.error('windows-x86_64 must point to MSI for legacy updater compatibility:', url); process.exit(1); } console.log('windows-x86_64 compatibility target:', url);"

      - name: Upload Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath "release-assets/windows" -File | ForEach-Object { $_.FullName })
          $assets += "release-assets/latest.json"
          gh release upload $env:GITHUB_REF_NAME @assets `
            --repo "$env:RELEASE_OWNER/$env:RELEASE_REPO" `
            --clobber

  seal-release-candidate:
    name: Seal signed draft candidate
    needs:
      - build-macos
      - sign-windows
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Require an unpublished draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          release_json="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$RELEASE_OWNER/$RELEASE_REPO" \
            --json isDraft,isPrerelease,tagName,targetCommitish)"
          node -e '
            const release = JSON.parse(process.argv[1]);
            if (!release.isDraft) throw new Error("Release candidate must remain a draft");
            if (release.isPrerelease) throw new Error("Signed candidate must not be a prerelease");
            if (release.tagName !== process.env.GITHUB_REF_NAME) throw new Error("Release tag mismatch");
          ' "$release_json"

      - name: Download signed release candidate assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          mkdir -p candidate-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$RELEASE_OWNER/$RELEASE_REPO" \
            --dir candidate-assets

      - name: Validate and seal candidate manifest
        env:
          RELEASE_ASSETS_DIR: candidate-assets
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: node .github/scripts/seal-release-candidate.mjs

      - name: Upload candidate manifest without publishing
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" candidate-assets/release-manifest.json \
            --repo "$RELEASE_OWNER/$RELEASE_REPO" \
            --clobber
          test "$(gh release view "$GITHUB_REF_NAME" \
            --repo "$RELEASE_OWNER/$RELEASE_REPO" \
            --json isDraft \
            --jq .isDraft)" = "true"
