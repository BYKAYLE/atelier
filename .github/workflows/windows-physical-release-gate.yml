name: Windows Physical Release Gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Private draft release tag to install and verify"
        required: true
        type: string
      expected_version:
        description: "Installed Atelier version, without the v prefix"
        required: true
        type: string
      allow_initial_signed_channel:
        description: "Allow a clean install only for the first signed direct-channel release"
        required: false
        type: boolean
        default: false
      require_smart_app_control_evidence:
        description: "Fail when Windows cannot report Smart App Control state"
        required: false
        type: boolean
        default: true

env:
  RELEASE_OWNER: ${{ vars.RELEASE_OWNER || github.repository_owner }}
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.event.repository.name }}

concurrency:
  group: windows-physical-release-${{ github.repository }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  physical-release-gate:
    name: Signed candidate install, browser auth, restart, and Smart App Control
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Download sealed private draft candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($env:GITHUB_SHA -ne $sourceSha) {
            throw "Dispatch this workflow with 'Use workflow from' set to the exact release tag."
          }
          $releaseRepo = "$env:RELEASE_OWNER/$env:RELEASE_REPO"
          $release = gh release view $env:RELEASE_TAG --repo $releaseRepo --json isDraft,tagName | ConvertFrom-Json
          if (-not $release.isDraft -or $release.tagName -ne $env:RELEASE_TAG) {
            throw "Physical validation is allowed only for the exact private draft release."
          }
          if ($env:RELEASE_TAG -ne "v$env:EXPECTED_VERSION") {
            throw "Release tag and expected version do not match."
          }
          New-Item -ItemType Directory -Force -Path candidate-assets | Out-Null
          gh release download $env:RELEASE_TAG --repo $releaseRepo --dir candidate-assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download the draft release assets." }

      - name: Verify sealed candidate manifest
        shell: pwsh
        env:
          RELEASE_ASSETS_DIR: candidate-assets
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $env:RELEASE_SOURCE_SHA = (git rev-parse HEAD).Trim()
          node .github/scripts/verify-release-candidate.mjs

      - name: Verify signed Windows installer payloads
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $arguments = @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "tools/windows-package-smoke.ps1",
            "-BundleRoot", "candidate-assets",
            "-StoreRoot", "artifacts/no-store-package",
            "-ExpectedVersion", $env:EXPECTED_VERSION,
            "-ReleaseTag", $env:RELEASE_TAG,
            "-SourceSha", $sourceSha,
            "-RunId", $env:GITHUB_RUN_ID,
            "-EvidencePath", "artifacts/windows-package-smoke/windows-package-smoke.json",
            "-RequireAuthenticode"
          )
          powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "Signed Windows package proof failed." }

      - name: Install and restart the exact signed candidate
        id: install-gate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          ALLOW_INITIAL_SIGNED_CHANNEL: ${{ inputs.allow_initial_signed_channel }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $arguments = @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "tools/windows-release-candidate-gate.ps1",
            "-BundleRoot", "candidate-assets",
            "-ExpectedVersion", $env:EXPECTED_VERSION,
            "-ReleaseTag", $env:RELEASE_TAG,
            "-SourceSha", $sourceSha,
            "-RunId", $env:GITHUB_RUN_ID,
            "-EvidenceDir", "artifacts/windows-release-candidate"
          )
          if ($env:ALLOW_INITIAL_SIGNED_CHANNEL -eq "true") {
            $arguments += "-AllowInitialSignedChannel"
          }
          powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "Signed candidate installation gate failed." }

      - name: Run strict provider and visible-browser gate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          ATELIER_EXE: ${{ steps.install-gate.outputs.atelier_exe }}
          REQUIRE_SMART_APP_CONTROL_EVIDENCE: ${{ inputs.require_smart_app_control_evidence }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows-provider-smoke.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows provider smoke self-test failed." }
          if (-not $env:ATELIER_EXE) { throw "Candidate gate did not return the installed Atelier.exe path." }
          $arguments = @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "tools/windows-provider-smoke.ps1",
            "-Login",
            "-Strict",
            "-RestartApplication",
            "-RequireRendererReadyEvidence",
            "-RequireAuthenticode",
            "-RequireBrowserProcessEvidence",
            "-RequireVisibleBrowserWindowEvidence",
            "-ExpectedVersion", $env:EXPECTED_VERSION,
            "-AtelierExe", $env:ATELIER_EXE,
            "-ReleaseTag", $env:RELEASE_TAG,
            "-SourceSha", $sourceSha,
            "-RunId", $env:GITHUB_RUN_ID,
            "-LogDir", "artifacts/windows-provider-current"
          )
          if ($env:REQUIRE_SMART_APP_CONTROL_EVIDENCE -eq "true") {
            $arguments += "-RequireSmartAppControlEvidence"
          }
          powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "Strict Windows provider gate failed." }

      - name: Upload physical gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atelier-windows-physical-release-gate-${{ inputs.release_tag }}
          path: |
            artifacts/windows-release-candidate/*
            artifacts/windows-package-smoke/*
            artifacts/windows-provider-current/*
          if-no-files-found: error
          retention-days: 30
