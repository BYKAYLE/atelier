name: Windows Physical Release Gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Private draft release tag to install and verify"
        required: true
        type: string
      expected_version:
        description: "Installed Atelier version, without the v prefix"
        required: true
        type: string

env:
  RELEASE_OWNER: ${{ vars.RELEASE_OWNER || github.repository_owner }}
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.event.repository.name }}

concurrency:
  group: windows-physical-release-${{ github.repository }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  physical-release-gate:
    name: Signed candidate install, browser auth, restart, and Smart App Control
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Derive signed-channel baseline from public release history
        id: signed-channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $releaseRepo = "$env:RELEASE_OWNER/$env:RELEASE_REPO"
          gh api --paginate --slurp "repos/$releaseRepo/releases?per_page=100" > release-history.json
          if ($LASTEXITCODE -ne 0) { throw "Could not read the complete public release history." }
          $env:RELEASE_HISTORY_PATH = "release-history.json"
          $env:RELEASE_SOURCE_SHA = (git rev-parse HEAD).Trim()
          $env:RELEASE_REPOSITORY = $releaseRepo
          $env:SIGNED_CHANNEL_HISTORY_RECEIPT = "artifacts/windows-signed-channel-history/signed-channel-history.json"
          node .github/scripts/resolve-initial-signed-channel.mjs
          if ($LASTEXITCODE -ne 0) { throw "Could not derive signed-channel eligibility." }
          $receipt = Get-Content -LiteralPath $env:SIGNED_CHANNEL_HISTORY_RECEIPT -Raw | ConvertFrom-Json
          $eligible = ([bool]$receipt.initialSignedChannelEligible).ToString().ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "allow_initial_signed_channel=$eligible"

      - name: Preflight physical runner before candidate download
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          ALLOW_INITIAL_SIGNED_CHANNEL: ${{ steps.signed-channel.outputs.allow_initial_signed_channel }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $arguments = @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "tools/windows-physical-runner-preflight.ps1",
            "-ReleaseTag", $env:RELEASE_TAG,
            "-ExpectedVersion", $env:EXPECTED_VERSION,
            "-SourceSha", $sourceSha,
            "-RunId", $env:GITHUB_RUN_ID,
            "-RunAttempt", $env:GITHUB_RUN_ATTEMPT,
            "-EvidencePath", "artifacts/windows-runner-preflight/windows-runner-preflight.json",
            "-Strict",
            "-RequireSmartAppControlEvidence",
            "-RequireSmartAppControlEnforcement"
          )
          if ($env:ALLOW_INITIAL_SIGNED_CHANNEL -eq "true") {
            $arguments += "-AllowInitialSignedChannel"
          }
          powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "Windows physical runner preflight failed." }

      - name: Download sealed private draft candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($env:GITHUB_SHA -ne $sourceSha) {
            throw "Dispatch this workflow with 'Use workflow from' set to the exact release tag."
          }
          $releaseRepo = "$env:RELEASE_OWNER/$env:RELEASE_REPO"
          $release = gh release view $env:RELEASE_TAG --repo $releaseRepo --json isDraft,tagName | ConvertFrom-Json
          if (-not $release.isDraft -or $release.tagName -ne $env:RELEASE_TAG) {
            throw "Physical validation is allowed only for the exact private draft release."
          }
          if ($env:RELEASE_TAG -ne "v$env:EXPECTED_VERSION") {
            throw "Release tag and expected version do not match."
          }
          New-Item -ItemType Directory -Force -Path candidate-assets | Out-Null
          gh release download $env:RELEASE_TAG --repo $releaseRepo --dir candidate-assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download the draft release assets." }

      - name: Verify sealed candidate manifest
        shell: pwsh
        env:
          RELEASE_ASSETS_DIR: candidate-assets
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $env:RELEASE_SOURCE_SHA = (git rev-parse HEAD).Trim()
          node .github/scripts/verify-release-candidate.mjs

      - name: Verify signed Windows installer payloads
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $arguments = @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "tools/windows-package-smoke.ps1",
            "-BundleRoot", "candidate-assets",
            "-StoreRoot", "artifacts/no-store-package",
            "-ExpectedVersion", $env:EXPECTED_VERSION,
            "-ReleaseTag", $env:RELEASE_TAG,
            "-SourceSha", $sourceSha,
            "-RunId", $env:GITHUB_RUN_ID,
            "-RunAttempt", $env:GITHUB_RUN_ATTEMPT,
            "-EvidencePath", "artifacts/windows-package-smoke/windows-package-smoke.json",
            "-RequireAuthenticode"
          )
          powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "Signed Windows package proof failed." }

      - name: Install the first signed-channel baseline
        if: ${{ steps.signed-channel.outputs.allow_initial_signed_channel == 'true' }}
        id: initial-install-gate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $arguments = @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "tools/windows-release-candidate-gate.ps1",
            "-BundleRoot", "candidate-assets",
            "-ExpectedVersion", $env:EXPECTED_VERSION,
            "-ReleaseTag", $env:RELEASE_TAG,
            "-SourceSha", $sourceSha,
            "-RunId", $env:GITHUB_RUN_ID,
            "-RunAttempt", $env:GITHUB_RUN_ATTEMPT,
            "-EvidenceDir", "artifacts/windows-release-candidate",
            "-AllowInitialSignedChannel"
          )
          powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "First signed-channel baseline installation failed." }

      - name: Run the exact signed candidate through the in-app updater
        id: updater-gate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          ALLOW_INITIAL_SIGNED_CHANNEL: ${{ steps.signed-channel.outputs.allow_initial_signed_channel }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $arguments = @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "tools/windows-updater-canary.ps1",
            "-BundleRoot", "candidate-assets",
            "-ExpectedVersion", $env:EXPECTED_VERSION,
            "-ReleaseTag", $env:RELEASE_TAG,
            "-SourceSha", $sourceSha,
            "-RunId", $env:GITHUB_RUN_ID,
            "-RunAttempt", $env:GITHUB_RUN_ATTEMPT,
            "-EvidenceDir", "artifacts/windows-updater-canary"
          )
          if ($env:ALLOW_INITIAL_SIGNED_CHANNEL -eq "true") {
            $arguments += "-AllowInitialSignedChannel"
          }
          powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "In-app updater canary failed." }

      - name: Verify the updater-installed candidate
        if: ${{ steps.signed-channel.outputs.allow_initial_signed_channel != 'true' }}
        id: install-gate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          UPDATER_EVIDENCE: ${{ steps.updater-gate.outputs.evidence_json }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          if (-not $env:UPDATER_EVIDENCE) {
            throw "The in-app updater gate did not return its evidence path."
          }
          $arguments = @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "tools/windows-release-candidate-gate.ps1",
            "-BundleRoot", "candidate-assets",
            "-ExpectedVersion", $env:EXPECTED_VERSION,
            "-ReleaseTag", $env:RELEASE_TAG,
            "-SourceSha", $sourceSha,
            "-RunId", $env:GITHUB_RUN_ID,
            "-RunAttempt", $env:GITHUB_RUN_ATTEMPT,
            "-EvidenceDir", "artifacts/windows-release-candidate",
            "-VerifyInstalledOnly",
            "-UpdaterEvidencePath", $env:UPDATER_EVIDENCE
          )
          powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "Updater-installed candidate verification failed." }

      - name: Run strict provider and visible-browser gate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          ATELIER_EXE: ${{ steps.updater-gate.outputs.atelier_exe }}
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          node --check tools/windows-connections-ui-witness.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows in-app login witness syntax check failed." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows-provider-smoke.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows provider smoke self-test failed." }
          if (-not $env:ATELIER_EXE) { throw "Candidate gate did not return the installed Atelier.exe path." }
          $arguments = @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "tools/windows-provider-smoke.ps1",
            "-Install",
            "-Login",
            "-InAppLogin",
            "-Strict",
            "-RestartApplication",
            "-RequireRendererReadyEvidence",
            "-RequireAuthenticode",
            "-RequireBrowserProcessEvidence",
            "-RequireVisibleBrowserWindowEvidence",
            "-RequireSmartAppControlEvidence",
            "-RequireSmartAppControlEnforcement",
            "-ExpectedVersion", $env:EXPECTED_VERSION,
            "-AtelierExe", $env:ATELIER_EXE,
            "-ReleaseTag", $env:RELEASE_TAG,
            "-SourceSha", $sourceSha,
            "-RunId", $env:GITHUB_RUN_ID,
            "-RunAttempt", $env:GITHUB_RUN_ATTEMPT,
            "-LogDir", "artifacts/windows-provider-current"
          )
          powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "Strict Windows provider gate failed." }

      - name: Seal the exact candidate and physical evidence
        shell: pwsh
        env:
          EVIDENCE_DIR: artifacts
          RELEASE_ASSETS_DIR: candidate-assets
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $env:RELEASE_SOURCE_SHA = (git rev-parse HEAD).Trim()
          node .github/scripts/seal-physical-release-evidence.mjs
          if ($LASTEXITCODE -ne 0) { throw "Could not seal the physical release evidence." }

      - name: Upload physical gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atelier-windows-physical-release-gate-${{ inputs.release_tag }}
          path: |
            artifacts/windows-runner-preflight/*
            artifacts/windows-signed-channel-history/*
            artifacts/windows-release-candidate/*
            artifacts/windows-updater-canary/*
            artifacts/windows-release-seal/*
            artifacts/windows-package-smoke/*
            artifacts/windows-provider-current/*
          if-no-files-found: error
          retention-days: 30
